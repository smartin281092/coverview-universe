# Infra LOCALE uniquement — ENV-01.
# À la racine, et non dans infra/, pour deux raisons : `docker compose up -d`
# (CLAUDE.md §0bis) fonctionne sans -f, et le nom de projet Docker est celui du
# dépôt — depuis infra/ tous les produits s'appelleraient « infra » et
# partageraient leurs volumes.
# infra/ ne porte que le déploiement (Dockerfiles, compose de prod, Caddyfile).
#
# PostgreSQL DOIT être en même version majeure qu'en production (TEST-06) :
# les Testcontainers s'alignent dessus.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage objet local — STOR-01 : le MÊME code qu'en production passe par
  # l'adapter S3. Jamais de branche `if (dev) écrire sur disque`.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serveur mail de développement — MAIL-02. Interface : http://localhost:8025
  # Aucun email ne sort de la machine : les personas sont en .test (ENV-07).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  redisdata:
  miniodata:
