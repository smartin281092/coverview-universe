# Services de développement uniquement. Tous les ports sont bornés au loopback.
name: ${COMPOSE_PROJECT_NAME:-coverview-local}
services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_USER: coverview
      POSTGRES_PASSWORD: coverview-local
      POSTGRES_DB: coverview_local
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverview -d coverview_local"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  # MinIO ne publie plus d'image (Docker Hub, quay.io) : même build Chainguard que la production,
  # avec mc et la console. Il tourne en 65532 : un volume créé par l'ancienne image (root) se
  # reprend une fois par chown, voir README.
  minio:
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: coverview-local
      MINIO_ROOT_PASSWORD: coverview-local-storage
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest@sha256:98b916bd3c8d61f7633a52d3ea2f58d00620cb01ca57ab59edde68c347a95365
    restart: unless-stopped
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:48025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    restart: unless-stopped
    ports: ["127.0.0.1:53310:3310"]
    volumes: ["clamavdata:/var/lib/clamav"]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 20s
      timeout: 10s
      start_period: 120s
      retries: 15
volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdata:
