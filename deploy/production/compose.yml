# Pile CoverView de production sur cv-staging-01, derrière le Traefik de Coolify, qui porte TLS et
# HSTS. Une paire de routes par adresse garde ses certificats. Runbook : README.md.
# Réglages dans /opt/coverview-astra/.env, secrets de l'API dans api.env et de MinIO dans
# minio.env (0600 tous) ; les fichiers .example de ce dossier en décrivent les clés.
name: coverview-astra

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_DB: coverview
      POSTGRES_USER: coverview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coverview -d coverview"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/smartin281092/coverview-astra-api:${RELEASE:?}
    restart: unless-stopped
    environment:
      APP_ENV: production
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4100"
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: "1"
      FIXTURE_MODE: "false"
      EXTERNAL_ADAPTER_MODE: disabled
      # Comptes ouverts une fois WorkOS configuré (secrets dans api.env).
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      # Documents avec le profil « documents » (MinIO, ClamAV) et leurs secrets dans api.env.
      DOCUMENTS_ENABLED: ${DOCUMENTS_ENABLED:-false}
      # Travaux de fond : avis des commandes externes dès que l'email fonctionne, le reste avec les comptes.
      PARTNER_JOBS_ENABLED: "true"
      DATABASE_URL: postgres://coverview:${POSTGRES_PASSWORD:?}@postgres:5432/coverview
      REDIS_URL: redis://redis:6379
      # Stockage des documents : MinIO de cette pile, réseau privé ; sa réponse ACL est un stub.
      MINIO_ENDPOINT: http://minio:9000
      DOCUMENT_S3_MINIO: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # Adresse exigée par la configuration ; adaptateur local désactivé, jamais contactée.
      MAILPIT_URL: http://127.0.0.1:9
      # Email : Resend dès que RESEND_API_KEY est dans api.env, depuis le sous-domaine d'envoi.
      MAIL_FROM: ${MAIL_FROM:-CoverView <notifications@mail.coverview.ch>}
      CORS_ORIGINS: ${SITE_ORIGIN:-https://coverview.ch},https://wallet.coverview.ch,https://admin.coverview.ch,https://partner.coverview.ch
      AUTH_API_ORIGIN: ${API_ORIGIN:-https://api.coverview.ch}
      AUTH_WWW_ORIGIN: ${SITE_ORIGIN:-https://coverview.ch}
      AUTH_WALLET_ORIGIN: https://wallet.coverview.ch
      AUTH_ADMIN_ORIGIN: https://admin.coverview.ch
      AUTH_PARTNER_ORIGIN: https://partner.coverview.ch
    # Secrets (WorkOS, session, Resend), absents tant qu'ils ne sont pas saisis sur le serveur.
    env_file:
      - path: api.env
        required: false
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal, coolify]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.services.cva-api.loadbalancer.server.port: "4100"
      # Same definitions as on www: a route never depends on another container's health.
      traefik.http.middlewares.cva-https.redirectscheme.scheme: https
      traefik.http.middlewares.cva-https.redirectscheme.permanent: "true"
      traefik.http.middlewares.cva-hsts.headers.stsSeconds: "63072000"
      traefik.http.middlewares.cva-hsts.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.cva-hsts.headers.stsPreload: "true"
      traefik.http.routers.cva-api-http.entrypoints: http
      traefik.http.routers.cva-api-http.rule: Host(`api.coverview.ch`)
      traefik.http.routers.cva-api-http.middlewares: cva-https
      traefik.http.routers.cva-api.entrypoints: https
      traefik.http.routers.cva-api.rule: Host(`api.coverview.ch`)
      traefik.http.routers.cva-api.tls: "true"
      traefik.http.routers.cva-api.tls.certresolver: letsencrypt
      traefik.http.routers.cva-api.middlewares: cva-hsts
      traefik.http.routers.cva-api.service: cva-api

  www:
    image: ghcr.io/smartin281092/coverview-astra-www:${RELEASE:?}
    restart: unless-stopped
    environment:
      # Nom servi (sans port) et adresse de retour des surfaces fermées.
      SITE_HOST: ${SITE_HOST:-coverview.ch}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://coverview.ch}
    # Configuration de service, modifiable sans reconstruire l'image (redirection temporaire de /).
    volumes:
      - ./www.Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [coolify]
    healthcheck:
      # The served host, or Caddy would treat the probe as a closed surface and redirect it.
      test:
        - CMD-SHELL
        - 'wget -q --spider --header "Host: $${SITE_HOST}" http://127.0.0.1:8080/comparateur-assurance-maladie-2027'
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.services.cva-www.loadbalancer.server.port: "8080"
      traefik.http.middlewares.cva-https.redirectscheme.scheme: https
      traefik.http.middlewares.cva-https.redirectscheme.permanent: "true"
      traefik.http.middlewares.cva-hsts.headers.stsSeconds: "63072000"
      traefik.http.middlewares.cva-hsts.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.cva-hsts.headers.stsPreload: "true"
      traefik.http.routers.cva-www-http.entrypoints: http
      traefik.http.routers.cva-www-http.rule: Host(`coverview.ch`)
      traefik.http.routers.cva-www-http.middlewares: cva-https
      traefik.http.routers.cva-www.entrypoints: https
      traefik.http.routers.cva-www.rule: Host(`coverview.ch`)
      traefik.http.routers.cva-www.tls: "true"
      traefik.http.routers.cva-www.tls.certresolver: letsencrypt
      traefik.http.routers.cva-www.middlewares: cva-hsts
      traefik.http.routers.cva-www.service: cva-www
      # Surfaces fermées jusqu'à la recette : le site les renvoie vers l'accueil.
      traefik.http.routers.cva-closed-admin-http.entrypoints: http
      traefik.http.routers.cva-closed-admin-http.rule: Host(`admin.coverview.ch`)
      traefik.http.routers.cva-closed-admin-http.middlewares: cva-https
      traefik.http.routers.cva-closed-admin.entrypoints: https
      traefik.http.routers.cva-closed-admin.rule: Host(`admin.coverview.ch`)
      traefik.http.routers.cva-closed-admin.tls: "true"
      traefik.http.routers.cva-closed-admin.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-admin.middlewares: cva-hsts
      traefik.http.routers.cva-closed-admin.service: cva-www
      traefik.http.routers.cva-closed-wallet-http.entrypoints: http
      traefik.http.routers.cva-closed-wallet-http.rule: Host(`wallet.coverview.ch`)
      traefik.http.routers.cva-closed-wallet-http.middlewares: cva-https
      traefik.http.routers.cva-closed-wallet.entrypoints: https
      traefik.http.routers.cva-closed-wallet.rule: Host(`wallet.coverview.ch`)
      traefik.http.routers.cva-closed-wallet.tls: "true"
      traefik.http.routers.cva-closed-wallet.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-wallet.middlewares: cva-hsts
      traefik.http.routers.cva-closed-wallet.service: cva-www
      traefik.http.routers.cva-closed-partner-http.entrypoints: http
      traefik.http.routers.cva-closed-partner-http.rule: Host(`partner.coverview.ch`)
      traefik.http.routers.cva-closed-partner-http.middlewares: cva-https
      traefik.http.routers.cva-closed-partner.entrypoints: https
      traefik.http.routers.cva-closed-partner.rule: Host(`partner.coverview.ch`)
      traefik.http.routers.cva-closed-partner.tls: "true"
      traefik.http.routers.cva-closed-partner.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-partner.middlewares: cva-hsts
      traefik.http.routers.cva-closed-partner.service: cva-www
      traefik.http.routers.cva-closed-intelligence-http.entrypoints: http
      traefik.http.routers.cva-closed-intelligence-http.rule: Host(`intelligence.coverview.ch`)
      traefik.http.routers.cva-closed-intelligence-http.middlewares: cva-https
      traefik.http.routers.cva-closed-intelligence.entrypoints: https
      traefik.http.routers.cva-closed-intelligence.rule: Host(`intelligence.coverview.ch`)
      traefik.http.routers.cva-closed-intelligence.tls: "true"
      traefik.http.routers.cva-closed-intelligence.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-intelligence.middlewares: cva-hsts
      traefik.http.routers.cva-closed-intelligence.service: cva-www
      traefik.http.routers.cva-closed-staging-http.entrypoints: http
      traefik.http.routers.cva-closed-staging-http.rule: Host(`staging.coverview.ch`)
      traefik.http.routers.cva-closed-staging-http.middlewares: cva-https
      traefik.http.routers.cva-closed-staging.entrypoints: https
      traefik.http.routers.cva-closed-staging.rule: Host(`staging.coverview.ch`)
      traefik.http.routers.cva-closed-staging.tls: "true"
      traefik.http.routers.cva-closed-staging.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-staging.middlewares: cva-hsts
      traefik.http.routers.cva-closed-staging.service: cva-www
      traefik.http.routers.cva-closed-api-staging-http.entrypoints: http
      traefik.http.routers.cva-closed-api-staging-http.rule: Host(`api.staging.coverview.ch`)
      traefik.http.routers.cva-closed-api-staging-http.middlewares: cva-https
      traefik.http.routers.cva-closed-api-staging.entrypoints: https
      traefik.http.routers.cva-closed-api-staging.rule: Host(`api.staging.coverview.ch`)
      traefik.http.routers.cva-closed-api-staging.tls: "true"
      traefik.http.routers.cva-closed-api-staging.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-api-staging.middlewares: cva-hsts
      traefik.http.routers.cva-closed-api-staging.service: cva-www
      traefik.http.routers.cva-closed-admin-staging-http.entrypoints: http
      traefik.http.routers.cva-closed-admin-staging-http.rule: Host(`admin.staging.coverview.ch`)
      traefik.http.routers.cva-closed-admin-staging-http.middlewares: cva-https
      traefik.http.routers.cva-closed-admin-staging.entrypoints: https
      traefik.http.routers.cva-closed-admin-staging.rule: Host(`admin.staging.coverview.ch`)
      traefik.http.routers.cva-closed-admin-staging.tls: "true"
      traefik.http.routers.cva-closed-admin-staging.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-admin-staging.middlewares: cva-hsts
      traefik.http.routers.cva-closed-admin-staging.service: cva-www
      traefik.http.routers.cva-closed-wallet-staging-http.entrypoints: http
      traefik.http.routers.cva-closed-wallet-staging-http.rule: Host(`wallet.staging.coverview.ch`)
      traefik.http.routers.cva-closed-wallet-staging-http.middlewares: cva-https
      traefik.http.routers.cva-closed-wallet-staging.entrypoints: https
      traefik.http.routers.cva-closed-wallet-staging.rule: Host(`wallet.staging.coverview.ch`)
      traefik.http.routers.cva-closed-wallet-staging.tls: "true"
      traefik.http.routers.cva-closed-wallet-staging.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-wallet-staging.middlewares: cva-hsts
      traefik.http.routers.cva-closed-wallet-staging.service: cva-www
      traefik.http.routers.cva-closed-partner-staging-http.entrypoints: http
      traefik.http.routers.cva-closed-partner-staging-http.rule: Host(`partner.staging.coverview.ch`)
      traefik.http.routers.cva-closed-partner-staging-http.middlewares: cva-https
      traefik.http.routers.cva-closed-partner-staging.entrypoints: https
      traefik.http.routers.cva-closed-partner-staging.rule: Host(`partner.staging.coverview.ch`)
      traefik.http.routers.cva-closed-partner-staging.tls: "true"
      traefik.http.routers.cva-closed-partner-staging.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-partner-staging.middlewares: cva-hsts
      traefik.http.routers.cva-closed-partner-staging.service: cva-www
      traefik.http.routers.cva-closed-intelligence-staging-http.entrypoints: http
      traefik.http.routers.cva-closed-intelligence-staging-http.rule: Host(`intelligence.staging.coverview.ch`)
      traefik.http.routers.cva-closed-intelligence-staging-http.middlewares: cva-https
      traefik.http.routers.cva-closed-intelligence-staging.entrypoints: https
      traefik.http.routers.cva-closed-intelligence-staging.rule: Host(`intelligence.staging.coverview.ch`)
      traefik.http.routers.cva-closed-intelligence-staging.tls: "true"
      traefik.http.routers.cva-closed-intelligence-staging.tls.certresolver: letsencrypt
      traefik.http.routers.cva-closed-intelligence-staging.middlewares: cva-hsts
      traefik.http.routers.cva-closed-intelligence-staging.service: cva-www

  # Wallet, Partner et Admin, ouverts avec les comptes (COMPOSE_PROFILES=apps dans .env). Leurs
  # routes passent avant les redirections des surfaces fermées portées par www.
  apps:
    image: ghcr.io/smartin281092/coverview-astra-apps:${RELEASE:?}
    profiles: [apps]
    restart: unless-stopped
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:-https://coverview.ch}
    networks: [coolify]
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q --spider --header "Host: partner.coverview.ch" http://127.0.0.1:8080/'
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.services.cva-apps.loadbalancer.server.port: "8080"
      traefik.http.middlewares.cva-https.redirectscheme.scheme: https
      traefik.http.middlewares.cva-https.redirectscheme.permanent: "true"
      traefik.http.middlewares.cva-hsts.headers.stsSeconds: "63072000"
      traefik.http.middlewares.cva-hsts.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.cva-hsts.headers.stsPreload: "true"
      traefik.http.routers.cva-apps-http.entrypoints: http
      traefik.http.routers.cva-apps-http.rule: Host(`wallet.coverview.ch`) || Host(`partner.coverview.ch`) || Host(`admin.coverview.ch`)
      traefik.http.routers.cva-apps-http.priority: "1000"
      traefik.http.routers.cva-apps-http.middlewares: cva-https
      traefik.http.routers.cva-apps.entrypoints: https
      traefik.http.routers.cva-apps.rule: Host(`wallet.coverview.ch`) || Host(`partner.coverview.ch`) || Host(`admin.coverview.ch`)
      traefik.http.routers.cva-apps.priority: "1000"
      traefik.http.routers.cva-apps.tls: "true"
      traefik.http.routers.cva-apps.tls.certresolver: letsencrypt
      traefik.http.routers.cva-apps.middlewares: cva-hsts
      traefik.http.routers.cva-apps.service: cva-apps

  # Documents (21 octobre 2026), avec COMPOSE_PROFILES=apps,documents. Originaux chiffrés par
  # l'API avant stockage ; ni console ni port publié.
  # MinIO ne publie plus d'image (Docker Hub, quay.io) : build Chainguard depuis les sources,
  # maintenu, épinglé par digest ; il contient mc pour la sonde et l'administration.
  minio:
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    profiles: [documents]
    restart: unless-stopped
    command: ["server", "/data"]
    # Identifiants racine générés sur le serveur (minio.env, 0600) ; l'API a son propre utilisateur.
    env_file:
      - path: minio.env
        required: false
    volumes:
      - minio-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav@sha256:f0954d679017eb6d48221e2b2be3ac5457bf278a844f39b672376f55a085f591
    profiles: [documents]
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    # Signatures mises à jour par internet ; les analyses arrivent de l'API par le réseau privé.
    networks: [internal, egress]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 100
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 15

networks:
  internal:
    internal: true
  egress: {}
  coolify:
    external: true

volumes:
  postgres-data: {}
  minio-data: {}
  clamav-data: {}
