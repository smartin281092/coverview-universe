  notes: ["Prochaine tranche prioritaire après S-013a mobile réellement close ; WIP=1.","Les parents et consommateurs gardent tous leurs critères/sources et restent incomplets.","Fournisseur OpenAI choisi explicitement pendant cette tâche ; services et parcours codés, recette réelle encore requise. Clé API absente de l’environnement de cette tâche, aucune autre mémoire de processus inspectée.","Checkpoint 2026-09-07 : adapter OpenAI et parcours codés. Services réels ClamAV/MinIO/DPAPI vérifiés ; typecheck, lint, frontières, knip et 21 tests HTTP existants passent. OpenAI absent et sessions de recette expirées ; CUA échoue à initialiser son noyau. Aucun critère V3 clôturé, voir roadmap/evidence/S-042a.md.","Extension utilisateur : bibliothèque, profil et autorisations ; sources et recette canonique dans roadmap/evidence/document-library-authorizations.md. Édition sur place et compagnies persistantes livrées le 7 septembre ; signature et envoi restent non raccordés.","Extension personnes/entités et sections médicales livrée sans compte tiers implicite ni sélection globale ; procuration/OCR restent ceux du titulaire. Capture physique de carte non exercée, aucune donnée fictive dans le compte réel. Session GPT-6, effort effectif non exposé ; preuves dans roadmap/evidence/profile-sections-identity-attachment.md.","Revue 2026-09-08 : les mentions antérieures de clé absente, sessions expirées et panne CUA sont des checkpoints historiques. Analyse réelle confirmée par l’utilisateur et fiche authentifiée observée dans roadmap/evidence/document-reading-ux.md ; la clôture complète C01–C07 reste à consolider. Voir roadmap/evidence/roadmap-review-2026-09-08.md.","Extension Admin/utilisateurs et ciblage des documents en cours dans le checkout partagé le 2026-09-08 : aucune livraison déduite des fichiers modifiés. Préserver son propriétaire et ses travaux ; borner cette extension avant tout nouveau périmètre selon PROG-14.","Extension Admin demandée le 8 septembre 2026 : annuaire utilisateurs, gestion des profils liés et documents explicitement ciblés ; plan roadmap/plans/S-042a-admin-users.plan.md, preuves roadmap/evidence/admin-users.md. Ne clôture pas les critères globaux S-042a encore incomplets.","Demande explicite /ship du 9 septembre 2026 : compte rendu partiel livré, statut review ; aucune clôture done ou dépendance libérée. Artefact canonique roadmap/evidence/S-042a-ship-2026-09-09.md. Les obstacles historiques de clé absente sont dépassés ; les limites actuelles sont détaillées par critère.","Suite préparée dans le bilan de livraison : brouillon S-080, plan existant et session recommandée gpt-6-astra/ultra ; aucun relais démarré ni travail concurrent pendant cette revue incomplète.","Reprise explicitement demandée le 9 septembre après /ship : lecture du passeport et capture de plusieurs photos dans Documents. Plan roadmap/plans/S-042a-document-capture.plan.md ; journal roadmap/evidence/document-capture.md. Nouvelle lecture du passeport réussie sans assouplir les contrôles ; préparation photo/PDF et aperçu en cours de recette.","Extension du 9 septembre : revue simplifiée, adresse groupée, correction distincte de la synchronisation, suivi par compagnie/profil et Centre d’action avec kanban service client Admin. Plan roadmap/plans/S-042a-action-center.plan.md ; vérifications et limites roadmap/evidence/document-action-center.md. Statut running conservé ; aucun envoi externe déduit de la mise en file.","Deuxième évolution du Centre d’action : regroupement par donnée/profil, page de résolution avec réponses proposées et libres, activité, progression et badge ; Générales à compléter, signatures tracées et archives datées, mandat du profil exact requis pour transmettre. Même plan et ledger ; tests PostgreSQL et quatre builds passent, limites de recette et d’envoi conservées. Aucune clôture globale de S-042a.","Extension du 11 septembre : chaque profil possède son entrée Admin et une portée globale Wallet. Un transfert conserve le profil lié sous le compte destination et révoque les consentements historiques sans changer leurs reçus. Les mentions antérieures de l’absence de sélection globale sont historiques. Plan roadmap/plans/S-042a-profile-dossiers.plan.md ; ledger roadmap/evidence/profile-dossiers.md."]
