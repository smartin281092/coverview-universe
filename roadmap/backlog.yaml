  notes: ["Propriétaire unique S-011 : worktree9b02, branche codex/s-011-editorial ; préconditions propres et ascendance requise vérifiées avant mutation.","Ledger complet/captures : roadmap/evidence/S-011.md ; JSON de build S-011-build-check.json. Aucun nouveau package, schéma, permission ou secret.","S-011 review conserve C01/C04/C06 non vérifiés ; S-000b review inchangé. Aucune nouvelle slice éligible, preuve S-011-next-eligibility.json ; exception obstacle réel du mandat, pas de relais factice.","Chevauchement contact à réconcilier : S-080 possède l’entrée publique CRM ; après S-013/S-080 done, reprendre C06 S-011 avant S-012 qui enrichit le contact existant. Exiger S-012 avant S-011 créerait une boucle sémantique ; voir checkpoint/README www.","Les gabarits et contenus ont été repris à la demande de l’utilisateur : voir roadmap/evidence/marketing-redesign.md et ADR-0006. Statut review conservé, collecte commerciale et preuves externes toujours absentes.","Refonte xAI demandée après rejet de la version f8e1e07 : nouveau rendu et limites dans roadmap/evidence/xai-redesign.md. Statut review et dépendance à la collecte persistante conservés.","Correction utilisateur suivante : preset shadcn b38oXC5rf effectivement réappliqué, Geist titres/corps et MONTECH V.02 fourni pour les métadonnées ; composants partagés réutilisés, fond blanc/cards en aplat sans cadre. ADR-0008 et roadmap/evidence/shadcn-typography.md. Statut et limites fonctionnelles conservés.","Revue 2026-09-08 : S-000b et S-013a sont done ; l’absence ancienne de WorkOS réel et de prochaine slice éligible n’est plus actuelle. Ordre aligné sur execution-policy.md : après S-042a, S-080 puis reste S-011 puis S-012. Statut review conservé ; détails dans roadmap/evidence/roadmap-review-2026-09-08.md.","Extension explicite du 30 septembre 2026 : comparateur public maladie 2027, primes Priminfo importées réellement, carte aux 42 régions et guide de 13 questions. Plan roadmap/plans/health-2027.plan.md et ledger roadmap/evidence/health-2027.md ; prestations/clubs partiellement documentés, aucun déploiement. Cette extension ne clôt ni S-011 ni S-042a.","Extension autorisée du 1er octobre 2026 : recommandation maladie adaptative WWW/API, catalogue de 138 fiches sur 32 assureurs/153 modèles examinés, 323 contrôles nominatifs et configuration Admin protégée. Plan roadmap/plans/health-adaptive.plan.md ; preuves et limites roadmap/evidence/health-adaptive.md. Aucun modèle entièrement vérifié, aucun déploiement. Ne clôt pas S-011 ni S-042a.","Extension du 1er octobre 2026 : carte plein écran, primes frontalières 2027 importées (2230 lignes, 14 assureurs, 30 pays), profil et questionnaire ajustés, géolocalisation volontaire. Plan health-map-profile.plan.md et ledger roadmap/evidence/health-map-profile.md ; soins transfrontaliers et avantages hors simulation personnalisée.","Comparateur maladie : volet liste avec affinage conservé, badges issus du moteur, 32 logos officiels, redistribution environnementale 2027 sourcée et suivi continu de la bulle. Retouche utilisateur livrée localement ; preuves et limites : roadmap/evidence/health-results-panel.md.","Extension du 2 octobre 2026 : contrat actuel choisi en deux étapes, 217472 primes CH et 2230 primes UE/AELE/UK 2026 importées et écarts 2026/2027 calculés côté serveur. Preuves, limites et état local : roadmap/evidence/health-current-2026.md. Aucun déploiement ni clôture S-011.","Extension du 4 octobre 2026 : prestations supplémentaires des 153 modèles relevées sur les pages produit officielles (1014 pages, 32 assureurs), uniformisées en 40 types canoniques (catalogue 514 fiches, 275 offertes avec la base seule). Filtre du comparateur, question de préférences et valorisation dans le moteur, seuil de preuve administrable. Plan roadmap/plans/health-benefit-taxonomy.plan.md ; preuves et limites roadmap/evidence/health-benefit-taxonomy.md. Aucun déploiement ni clôture S-011."]
