  cost: ""
  decisions: [{"ref":"project.workos","question":"Quel environnement et quelles identités WorkOS utiliser pour vérifier les flux réels ?","answer":"Option a : utiliser l’environnement de développement du projet coverview et des identités de test explicitement autorisées. Identifier d’abord cet environnement en lecture seule ; ne déduire aucun client ID, compte autorisé ou droit administratif du nom du projet.","evidence":"WorkOS coverview/LocalHost et deux emails réels explicitement autorisés. Le 2026-09-06, callback réparé puis comptes BMP et Hook réellement connectés et persistés ; isolation croisée, continuité et révocations vérifiées. Habilitation administrative encore absente. Détails : roadmap/evidence/S-000b.md."},{"ref":"project.auth-methods","question":"Si les méthodes constatées diffèrent du parcours email/OTP, quel changement appliquer ?","answer":"Option a : si un écart est réellement constaté, préparer et présenter le diff exact des méthodes et callbacks pour configurer email/OTP et MFA admin dans l’environnement de développement identifié. Conserver les configurations sans rapport avec ce parcours.","evidence":"Callback exact, Magic Auth, homepage www et MFA Optional enregistrés et relus après confirmations utilisateur. Le callback réel confirme que l’issuer de l’access token est distinct de la découverte OIDC ; normalisation locale bornée corrigée. Aucun facteur Authenticator ni droit admin attribué. Détails : roadmap/evidence/S-000b.md."},{"ref":"S-000b-authorized-test-identities","question":"Quelles identités sont autorisées pour les tests réels et fictifs ?","answer":"Les deux emails réels et les comptes fictifs explicitement autorisés par l’utilisateur sont inventoriés au ledger S-000b ; aucune habilitation administrative réelle déduite.","evidence":"Message utilisateur du 2026-09-06 ; créations et premier OTP réellement observés, détails dans roadmap/evidence/S-000b.md."},{"ref":"S-000b-owner-totp-enrollment","question":"Comment terminer le parcours Authenticator absent sans fabriquer de credential ni permission ?","answer":"Parcours propriétaire explicite dans une page dédiée, SDK WorkOS installé. API enrollment distincte du step-up administratif : état, démarrage, reprise du challenge, confirmation, annulation explicitement demandée du seul facteur créé par cette inscription non confirmée. Réservation durable unique par utilisateur avant création distante ; challenges liés à la session et consommés atomiquement. QR transitoire renvoyé une fois, sans seed/URI ni QR en base, logs, fichiers ou cache TanStack. Confirmation revalide la session, renouvelle le handle et audite sans créer de permission ni de preuve MFA administrative. Un résultat distant ambigu reste fermé et visible, sans création répétée automatique.","evidence":"Mandat de reprise S-000b et execution-policy ; SHA c57f145 vérifié identique dans ffdf, main et API 9b02, checkouts propres. SDK 10.13.0 inspecté : createUserAuthFactor/verifyChallenge disponibles, aucun statut de confirmation dans listUserAuthFactors. Seul le titulaire lance, scanne et confirme le credential. Désignation du bénéficiaire admin toujours absente."},{"ref":"S-000b-authentication-freshness","question":"Quelle preuve de fraîcheur protège la création et l’annulation Authenticator ?","answer":"auth_time issu du JWT WorkOS déjà vérifié, persisté nullable sur la session. Une date locale de création ne suffit pas ; sans preuve récente, lien de reconnexion explicite avec maxAge:0. Connexion et callbacks ordinaires conservent leurs destinations et contrôles.","evidence":"Finding de revue indépendant pendant enrollment, documentation WorkOS reauthentication et SDK installé ; deux cas SDK existants adaptés passent. Ce besoin concret justifie le seul ajout de lecture de claim au callback acquis."},{"ref":"S-000b-admin-beneficiary","question":"Quel compte habiliter comme administrateur CoverView pour terminer la vérification MFA ?","answer":"sebastien@bmpartners.ch, identité canonique usr_bea1435d-b890-4349-8998-9d75e2b188dc et WorkOS user_01M1VKYDZP0R3CT5AAYV6CKZCY. Permission locale administration.access uniquement dans l’environnement LocalHost autorisé.","evidence":"Réponse explicite utilisateur du 2026-09-06 dans tâche 01a077bc-b0f8-7630-a4fe-861eec6e71f4 ; paire et préconditions relues avant transaction. Trace : roadmap/evidence/S-000b-admin-grant.md."}]
  notes: ["Propriétaire initial (historique) : tâche 01a07385-bfec-7021-b1d0-1df3708cd86b, worktree 4133, branche codex/s-000b-workos. SHA requis vérifié ancêtre de HEAD ; checkout initial propre.","État courant : callback réparé et recette personnelle réelle réussie sur deux comptes. L’ancien issuer OIDC était inadapté aux access tokens AuthKit. Détails et historique : roadmap/evidence/S-000b.md.","Journal courant de reprise et historique : roadmap/evidence/S-000b.md. Activation mémoire seule et limites dans le README identity.","S-010 done et S-011 review conservées. S-013 et les dépendantes attendent la clôture S-000b, dont seule la preuve administrative/MFA réelle reste ouverte après réparation du callback.","Avertissements bundles Vite >500kB ; RLS non activée (DEVRAIT DATA-09), reprises distantes à la commande/prochaine connexion, bornes fournisseur documentées.","Reprise explicite du 2026-09-06 après rejet utilisateur de la preview obsolète et non fonctionnelle. Plan borné roadmap/handoffs/S-000b-recovery.md ; compte prioritaire, correction UI et activation WorkOS réelle à reprendre.","Historique de reprise : correction utilisateur fixtures/smoke/surface enregistrée dans execution-policy.md. Injection préparée sans secret dans fichier ou chat, puis API réellement activée par l’opérateur ; détails des étapes dans le ledger.","Refonte blanche historique : ADR-0006 et ledger marketing-redesign ; remplacée par ADR-0007 puis ADR-0008, aucune interface récente écrasée par la reprise identity.","La référence xAI fournie ensuite remplace la direction visuelle précédente : ADR-0007, source intacte references/xai-style-reference.md et ledger roadmap/evidence/xai-redesign.md. Refonte commune www/Wallet/équipe et navigation éditoriale relues ; aucune connexion réelle WorkOS déduite. Statut running conservé.","Correction utilisateur suivante : preset shadcn b38oXC5rf effectivement réappliqué, Geist titres/corps et MONTECH V.02 fourni pour les métadonnées ; composants partagés réutilisés, fond blanc/cards en aplat sans cadre. ADR-0008 et roadmap/evidence/shadcn-typography.md. Statut et limites fonctionnelles conservés.","Reprise callback du 2026-09-06 : nouveau worktree 6e7a propriétaire. Réconciliation documentaire depuis main d6461fb et codex/s-011-editorial 7a736059ed26bf4461cea673cacd4372c6efe750 ; choix UI Geist/Montech/preset et ADR-0008 conservés. Checkpoint roadmap/handoffs/S-000b-callback-repair.md.","API 9b02 rechargée par son watcher existant après contrôle du contenu des fichiers. Configuration normalisée sans extraction, écriture ou transfert des secrets ; instrumentation temporaire retirée après recette, /health ready et identity/config enabled:true relus. Préserver le superviseur et ses variables.","Relais de clôture S-000b : roadmap/handoffs/S-000b-mfa-completion.md. Le parcours d’inscription TOTP manque dans le code ; le préparer avant l’intervention personnelle indispensable. Nouvelle tâche gpt-6-astra / ultra, même slice et périmètre, puis S-013 seulement après preuves C05.","Plan borné Authenticator, propriétaire ffdf : API/contrats et migration additive de suivi technique ; page dédiée réutilisant Geist/Montech, Input/Label/Button et formulaires Zod existants, liens compte/MFA. G-02/03/04, AUTH-11, identity.admin.1, SEC-04, DATA-01/02/03/07, FRONT-10/12/14. Aucun changement callback, UI commune, méthodes WorkOS, infrastructure ou attribution. Pas nouvelle batterie fixtures/smoke. Oracles : types/lint/build concernés, revue indépendante sécurité, migration additive sur s000b puis parcours réel utilisateur et C05 avant done/S-013. Risques : doublons de création, rejeu, réponses perdues, révocation en vol et exposition QR ; réservations/claims SQL, contrôles après réseau, reprise explicite et nettoyage mémoire. Catégorie nouvelle : suivi inscription MFA propriétaire technique sensible, IDs/status/dates sans secret ; export/rétention S-130/S-131, rollback applicatif conserve la table.","Propriétaire courant ffdf, codex/s-000b-authenticator. Inscription entièrement implémentée ; SDK/réauthentification réelle requise contrôlés, nouvelles routes propres. État/reprise/documents dans ledger S-000b et handoff MFA. C05 attend seulement sa recette personnelle et attribution désignée après déploiement ; pas de relais S-013 anticipé.","Préparation utilisateur achevée dans Chrome le 2026-09-06 : page Authenticator du compte BMP prête, création non lancée. Code da362e0 intégré et runtime fonctionnel ; seule la recette personnelle C05 et la désignation/grant tracé restent. Une expiration de fraîcheur demande la reconnexion explicite disponible dans le parcours.","Clôture réelle 2026-09-06 : ledger S-000b et attribution nominative S-000b-admin-grant.md. Toutes les notes précédentes running/review/manque enrollment/désignation sont historiques. Nouvelle tâche S-013 via handoff S-013.md après intégration conservatrice du SHA final."]
