  notes: ["Extension explicite du 2 octobre 2026 : socle Partner API/Partner/Wallet/Admin implémenté partiellement, brief intégral references/coverview-partner-2026-10-02.md. Plan roadmap/plans/partner-core.plan.md, couverture roadmap/partner-coverage.md et preuves roadmap/evidence/partner-core.md. V0–V2 passent ; V3 limité aux accès non habilités et à Wallet vide/formulaire. Marketplace/économie/continuité/qualité/signature restent ouverts ; aucune clôture de S-110 ni des dépendances antérieures.","Relais 52d5 du 2 octobre : notifications durables Partner/Wallet, lecture distincte de la résolution, scheduler de rappels/réexamens et reprise humaine CoverView bornée implémentés. Migrations 0029–0030 ; 31 contrôles ciblés puis 6 tests Partner finaux passés, builds/types/lint vérifiés. V3 limité au Wallet vide et refus opérationnel Partner. Paramètres Admin, collaboration, matching, demandes historiques et autres tracks restent ouverts. Voir roadmap/evidence/partner-core.md.","Relais fb54 du 2 octobre : paramètres Admin de continuité versionnés, acceptation distincte, calendrier explicite et échéances figées, migration 0031 locale. Neuf tests PostgreSQL Partner, types/lint/builds/frontières/Knip passent ; V3 limité au refus Admin réel sur 4112. Collaboration/co-conseil/transfert puis insurance-requests et autres tracks restent ouverts. Voir roadmap/evidence/partner-core.md.","Relais 8d4a du 2 octobre : collaboration/co-conseil/apport/transfert explicites avec acceptation, périmètres/communications et droits courants, historique et échéances conservés, demande Wallet de nouvel interlocuteur. Migration 0032 locale ; 13 scénarios Partner PostgreSQL, types/lint/builds/frontières/Knip vérifiés. V3 limité à la barrière de candidature sur /collaborations, aucun grant réel fabriqué. Raccordement insurance-requests puis autres tracks du registre restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-insurance-requests-suite.md.","Relais f41b du 2 octobre : demandes insurance-requests reliées par personne au profil canonique après accord explicite du propriétaire courant, source unique/rejeu/concurrence et transfert préservés, reprise paginée dans Wallet. Migration0033 locale ; 28 tests PostgreSQL Partner/demandes finaux passent, types/lint/builds vérifiés. V3 : navigation réelle desktop/mobile et état vide, aucun accord/dossier réel fabriqué. Signature, contrat exact/comparaison, référents/matching, marketplace/économie et qualité restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-current-contract-suite.md.","Relais 175f du 2 octobre : contrat actuel exact choisi et partagé par propriétaire courant, référence canonique sans copie de police, revues sourcées/versionnées, gains ET pertes et annualisation serveur Partner/Wallet, invalidation à changement de source. Migration0034 locale ; campagne38 tests PostgreSQL puis16 Partner finaux, types/lint/builds vérifiés. V3 limité Wallet vide/mobile et candidature Partner ; aucun consentement/dossier/grant réel de recette. Versions/source figée des offres, historique Wallet, inspection de demande individuelle, signature/contrat final puis tous les tracks restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-offer-versions-suite.md.","Relais d02c du 2 octobre : versions d’offres liées à leur source exacte, contrôles à revue/publication/décision, retrait/historique paginé Partner/Wallet et événements par version. Migration0035 locale, 40 tests PostgreSQL dont18 Partner, types/lint/builds et frontières/Knip ciblés vérifiés. V3 limité Wallet vide et candidature Partner ; dialogues remplis/download non vérifiés. Inspection structurée individuelle insurance-request puis import multiple/signature/police finale et tout le registre restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-request-inspection-suite.md.","Relais 7a52 du 2 octobre : inspection structurée de la demande individuelle insurance-request dans Partner, source historique seule et provenance/accord figés, lecture opérationnelle sous verrou et audit dédupliqué. Aucun nouveau schéma. 41 tests PostgreSQL, types/lint/builds quatre apps et frontières/Knip ciblés vérifiés. V3 limité Wallet vide et candidature Partner ; dialogue rempli/clavier/mobile non vérifiés, aucun dossier/consentement/grant réel fabriqué. Import multiple, décisions restantes, signature/police finale et tout le registre restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-offer-import-suite.md.","Relais c0e2 du 2 octobre : import multiple d’originaux privés par Lead, file persistante paginée/reprise/réessai par document, déduplication par contenu, analyse distincte et préparation sans publication automatique. Migration0036 ; 48 tests PostgreSQL, types/lint/builds quatre apps, frontières/Knip ciblés passent. Worker de nettoyage compatible requis pour préserver les pending retenus. V3 limité candidature Partner et Wallet vide ; aucun dossier/grant réel créé. Décisions restantes/refus UI puis signature/police finale et tous les tracks restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-decisions-suite.md.","Relais b9b3 du 2 octobre : refus Wallet motivé et récapitulatif/version/révision exacts, rejeu identique, notifications ciblées et réponses ouvertes jusqu’au suivi réel, droits après transfert de profil corrigés. 51 tests PostgreSQL/4 fichiers, types/lint/builds quatre apps et frontières/Knip ciblés passent ; aucune migration/dépendance. V3 limité Wallet/notifications vides et candidature Partner ; aucun dossier/grant réel créé. Police finale et preuve/signature puis tous les tracks restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-final-policy-suite.md.","Relais 1a5a : police reçue du profil canonique reliée à la version publiée exacte, contrôle humain sourcé, delta documentaire CHF, partage/retrait/historique et droits courants. Migration0037 locale ;55 tests PostgreSQL/4 fichiers, types/lint/builds quatre apps, frontières/Knip ciblés passent. V3 limité Wallet vide et candidature Partner, aucun dossier/grant fabriqué. Signature/acceptation et recette remplie manquantes ; référents par catégorie puis tous les tracks restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-referents-suite.md.","Relais b920 : référent habituel explicite par profil/catégorie, historique et révisions de sélection/profil, continuité humaine expliquée sans nouveau droit ni attribution automatique.0038 locale ;59 tests PostgreSQL/4 fichiers puis32 Partner finaux, types/lint/builds quatre apps, frontières/Knip ciblés verts. V3 limité dialogue/profil/catégories avant expiration de session ; callback WorkOS4133 non autorisé, aucun choix/grant/dossier fabriqué. Justificatifs de compétence par catégorie et examen Admin puis tous les tracks ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-eligibility-suite.md.","Relais8a00 : justificatifs professionnels privés par catégorie, déclaration personnelle et examen Admin motivé/portée/validité/retrait, sans habilitation ni certification inférée ; seul résumé documentaire dans la continuité.0039 locale ;64 tests PostgreSQL/5 fichiers, types/lint/builds quatre apps, frontières/Knip ciblés passent. V3 limité à connexion absente puis callback WorkOS4136 refusé, aucun justificatif/grant/dossier réel créé. Conventions/périmètre de distribution puis tous les tracks ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-conventions-suite.md.","Relais cc1c : conventions privées par membre/organisation/compagnie/catégorie, parties figées et contrôlées à l’envoi, examen Admin explicite avec portée/validité/retrait et historique.0040–0041 locales ;71 tests PostgreSQL/6 fichiers, types/lint/builds quatre apps, frontières/Knip ciblés passent. V3 non effectué : fichier WorkOS source absent, aucun grant/preuve/dossier réel créé. Critère global conventions toujours manquant sans compagnie/solution exacte. Suite : stabilité du périmètre professionnel, limite héritée de compétence puis tous les tracks. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-professional-scope-suite.md.","Relais5944 : stabilité du périmètre professionnel (0042), noms et révision figés, changement/aller-retour invalidant les constats de compétence/convention sans effacer les preuves ni créer d'identités. 78 tests PostgreSQL/7 fichiers puis51 finaux passent, types/lint/builds quatre apps et frontières/Knip ciblés verts. V3 non effectué : fichier WorkOS source absent, aucun runtime/grant/justificatif réel créé. Langues/zones structurées puis disponibilités/conflits/matching et tous les tracks restent ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-professional-preferences-suite.md.","Relais ce17 : langues et cantons entiers d'intervention déclarés, version personnelle immuable, lecture Admin et résumé minimal dans la continuité (0043). 58 tests PostgreSQL/5 fichiers finaux passent, types/lint/builds API/Partner/Wallet/Admin et www, frontières/Knip ciblés verts. Langue/zone restent à examiner pour le besoin ; aucun droit, examen, référent ou délai modifié. V3 non effectué faute de configuration WorkOS, aucun runtime/grant/client réel créé. Suite : préférences de conseil structurées/confirmées du besoin, puis disponibilités/conflits/matching et tous les tracks ouverts. Voir roadmap/evidence/partner-core.md et roadmap/handoffs/partner-client-preferences-suite.md.","Relais6469 : préférences de conseil par besoin/Lead confirmées par propriétaire Wallet courant, lecture Partner/Admin, historique et événements par sujet canonique (0044). 87 tests PostgreSQL/8 fichiers finaux passent ; types/lint/builds quatre apps et frontières/Knip ciblés verts. Portée monotone et révisions de profil protègent modifications/rattachements/transferts/aller-retour ; aucun effet sur Lead, horlo